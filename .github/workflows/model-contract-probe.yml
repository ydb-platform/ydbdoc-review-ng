name: Model contract probe

on:
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: Read-only policy-review audit for this GitHub run; no model call
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  critic-fallback:
    if: inputs.audit_run_id == ''
    runs-on: ubuntu-latest
    env:
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ vars.YANDEX_FOLDER_ID }}
      YDBDOC_MODEL: ${{ vars.YDBDOC_MODEL }}
      YDBDOC_MODEL_ARBITER: ${{ vars.YDBDOC_MODEL_ARBITER }}
      YDBDOC_MODEL_CRITIC_FALLBACK: ${{ vars.YDBDOC_MODEL_CRITIC_FALLBACK }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: python scripts/run_with_timeout.py 120 python -m pip install .
      - name: Probe critic-editor and independent arbiter contracts
        run: python scripts/run_with_timeout.py 180 python scripts/probe_critic_fallback.py
  review-audit:
    if: inputs.audit_run_id != ''
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      PYTHONSAFEPATH: '1'
      AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
      YDB_ENDPOINT: ${{ vars.YDB_ENDPOINT }}
      YDB_DATABASE: ${{ vars.YDB_DATABASE }}
      YDB_TOKEN: ${{ secrets.YDB_TOKEN }}
      YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install trusted audit dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes --index-url https://pypi.org/simple/ -r docker/review-requirements.lock
      - name: Read attempt metadata only
        shell: python
        run: |
          import json
          import os
          import re
          from ydbdoc_review_ng.policy_review.commands import _sdk

          run_id = os.environ['AUDIT_RUN_ID']
          if re.fullmatch(r'[1-9][0-9]{0,19}', run_id) is None:
              raise SystemExit('Invalid run ID')
          executor = _sdk(os.environ)
          try:
              rows = executor.execute(
                  'SELECT attempt, usage FROM doc_review_attempts WHERE owner LIKE $owner ORDER BY attempt;',
                  {'owner': '%' + run_id + '%'},
              )
              for row in rows:
                  metadata = json.loads(row['usage']) if row['usage'] else {}
                  print(json.dumps({'attempt': row['attempt'], **metadata}))
          finally:
              executor.close()
