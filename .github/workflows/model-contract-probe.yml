name: Model contract probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  critic-fallback:
    runs-on: ubuntu-latest
    env:
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ vars.YANDEX_FOLDER_ID }}
      YDBDOC_MODEL: ${{ vars.YDBDOC_MODEL }}
      YDBDOC_MODEL_ARBITER: ${{ vars.YDBDOC_MODEL_ARBITER }}
      YDBDOC_MODEL_CRITIC_FALLBACK: ${{ vars.YDBDOC_MODEL_CRITIC_FALLBACK }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime
        run: python scripts/run_with_timeout.py 120 python -m pip install .
      - name: Probe critic-editor and independent arbiter contracts
        run: python scripts/run_with_timeout.py 180 python scripts/probe_critic_fallback.py
