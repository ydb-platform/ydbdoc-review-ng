name: Documentation review
description: Run the shipped translation or verification composition
inputs:
  mode:
    description: translate or verify
    required: true
  pr:
    description: Source PR for translate, translation PR for verify
    required: true
  source-sha:
    description: Immutable authoritative source SHA
    required: true
  target-sha:
    description: Current translation head SHA for verify
    required: false
  budget-rub:
    description: Daily budget for translate
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: python -m pip install '.[runtime]'
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PR: ${{ inputs.pr }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        TARGET_SHA: ${{ inputs.target-sha }}
        BUDGET_RUB: ${{ inputs.budget-rub }}
        YDBDOC_RUNTIME_FACTORY: ydbdoc_review_ng.runtime:create_runtime
      run: |
        # Credentials remain environment references, never shell arguments.
        args=("$MODE" --pr "$PR" --source-sha "$SOURCE_SHA")
        case "$MODE" in
          translate) args+=(--budget-rub "$BUDGET_RUB") ;;
          verify) args+=(--target-sha "$TARGET_SHA") ;;
          *) exit 2 ;;
        esac
        python -m ydbdoc_review_ng.cli "${args[@]}"
