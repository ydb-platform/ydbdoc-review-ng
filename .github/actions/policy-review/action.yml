name: YDB documentation policy review
description: Trusted admission, five-minute debounce, Docker worker and publication
inputs:
  mode:
    description: gate, run or finalize
    default: run
  admission-token:
    description: Token with repository metadata read access; host only
    required: false
  publish-token:
    description: Token with PR comments and labels write access; host only
    required: true
  api-key:
    description: Same model API key as doc_translate; worker only
    required: false
  folder-id:
    description: Same model folder as doc_translate
    required: false
  budget-rub:
    description: Per-run maximum cost in RUB
    required: false
  rules-sha:
    description: Explicitly approved rules SHA before policy is merged; default is base SHA
    required: false
  ydb-endpoint:
    required: false
    description: Audit YDB endpoint
  ydb-database:
    required: false
    description: Audit YDB database
  ydb-token:
    required: false
    description: Audit service access token
  ydb-sa-key:
    required: false
    description: Audit service account key
outputs:
  admitted:
    description: Whether to enter the PR concurrency group
    value: ${{ steps.launch.outputs.admitted }}
  stop:
    description: Whether to cancel a closed or draft PR run
    value: ${{ steps.launch.outputs.stop }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Install trusted host dependencies
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../../..
      run: |
        python -m pip install --only-binary=:all: --require-hashes \
          --index-url https://pypi.yandex-team.ru/simple/ \
          -r "$ACTION_ROOT/docker/review-requirements.lock"
    - name: Launch policy review
      id: launch
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../../..
        PYTHONPATH: ${{ github.action_path }}/../../../src
        PYTHONSAFEPATH: '1'
        YDBDOC_POLICY_MODE: ${{ inputs.mode }}
        YDBDOC_REVIEW_READ_TOKEN: ${{ github.token }}
        YDBDOC_REVIEW_CHECKS_TOKEN: ${{ github.token }}
        YDBDOC_REVIEW_ADMISSION_TOKEN: ${{ inputs.admission-token }}
        YDBDOC_REVIEW_PUBLISH_TOKEN: ${{ inputs.publish-token }}
        YDBDOC_REVIEW_MAX_RUN_COST_RUB: ${{ inputs.budget-rub }}
        YDBDOC_REVIEW_RULES_SHA: ${{ inputs.rules-sha }}
        YANDEX_API_KEY: ${{ inputs.api-key }}
        YANDEX_FOLDER_ID: ${{ inputs.folder-id }}
        YDB_ENDPOINT: ${{ inputs.ydb-endpoint }}
        YDB_DATABASE: ${{ inputs.ydb-database }}
        YDB_TOKEN: ${{ inputs.ydb-token }}
        YDB_SA_KEY: ${{ inputs.ydb-sa-key }}
      run: python "$ACTION_ROOT/scripts/run_policy_review.py"
